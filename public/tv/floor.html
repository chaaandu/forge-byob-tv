<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>BYOB — Daily Leaderboard</title>
<link rel="stylesheet" href="/tv/tv.css">
<script>
  /* Inside the rotator this slide is built before it is shown, so it holds its
     entrance until told. Opened directly it never holds. The timeout is the
     safety: a rotator that fails to post must not freeze the board forever.

     **25s, and it must stay above `LEAD` in wall.html, which is 15s.** This
     fires while the frame is still hidden if it is shorter, and the slide is
     then revealed with its entrance already finished — it renders perfectly
     and simply never arrives, which is this wall's stated failure mode. */
  if (window.top !== window) {
    document.documentElement.classList.add('holding')
    const show = () => document.documentElement.classList.remove('holding')
    addEventListener('message', (e) => { if (e.data === 'byob:show') show() })
    setTimeout(show, 25000)
  }
</script>
<style>
/* ============================================================
   SLIDE 2 — the Daily Leaderboard / 10-Day Challenge.

   ── Two card types, because the reference is two card types ──
   A grand-prix standings page does not draw thirty-nine identical rows. It
   draws a big landscape CONSTRUCTOR card — faces, huge name, a swoosh of the
   team's colour, the maker's mark in the corner — and then a run of compact
   DRIVER cards underneath. Different objects for different jobs.

   39 is 3 + 36, and 36 is 6 x 6 exactly. So the day's top three get hero
   cards at 592x232 (2.55:1, the constructor card's proportion) and the other
   thirty-six get compact cards at 292x93. No ragged column, no filler tile,
   every venture on one screen.

   ── Why the top three get the faces ──
   The Ladder already earns its squad photographs on an ALL-TIME board, where
   the same three teams sit for weeks. Here they change every morning, so a
   venture that has never been near the top of the programme can be on this
   wall at 150px tall for a day because of one good Tuesday. That is a
   different promise from the Ladder's, and it is the one this slide can make.

   ── Colour is still only where the money is ──
   A venture that has not sold in the window keeps its card, its rank and its
   name, and loses its colour.
   ============================================================ */

/* ── The hero cards ─────────────────────────────────────── */
.heroes[hidden] { display: none; }
.heroes {
  position: absolute; left: var(--safe-x); right: var(--safe-x); top: 168px; height: 232px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; z-index: 2;
}

.hero {
  position: relative; overflow: hidden;
  border-radius: 26px; corner-shape: squircle;   /* see .card */
  /* ── The gradient is a fixed step in LIGHTNESS, not a fixed mix ──
     `color-mix(in srgb, var(--cd) 74%, white)` is a fixed mix, and a fixed mix
     toward white barely moves a card that is already pale. So only the dark
     cards — Atmiva, Mugshot — looked like they had a gradient at all, and the
     pale half of the board read as flat. `--a` and `--b` are the venture's own
     colour at +0.075 and -0.085 of OKLCh lightness, which is the same visible
     step on every card at either end of the range. */
  background: linear-gradient(112deg, var(--a), var(--b));
  color: var(--cdk);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 16px 34px rgba(0,0,0,0.42);
  animation: hero-in 640ms cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes hero-in { from { opacity: 0; transform: translateY(22px) scale(0.975); } to { opacity: 1; transform: none; } }

/* The venture's own edge, down the left, as on the compact cards. */
.hero-edge {
  position: absolute; left: 0; top: 0; bottom: 0; width: 14px; z-index: 3;
  background: var(--ce);
}

.hero-num {
  position: absolute; left: 30px; top: 2px; z-index: 2;
  font-size: 78px; font-weight: 900; font-stretch: 64%; line-height: 1;
  color: transparent; -webkit-text-stroke: 3px var(--cdk); opacity: 0.85;
  transform: skewX(-11deg);
}
.hero-squad { position: absolute; left: 20px; bottom: 0; z-index: 2; }
.squad { display: flex; align-items: flex-end; }
/* ── No fade on the wall ──
   `/live` fades the last fifth of each crop because a cutout there stands on
   the dark PAGE, and a photograph ending mid-chest on open background is a
   straight cut across somebody. Here the crop's bottom edge is the bar's own
   bottom edge and the bar clips, so there is nothing to soften — the fade was
   only dissolving the bodies into their own card. */
.person { position: relative; display: block; }
.person img { width: 100%; height: 100%; object-fit: contain; object-position: bottom center; }
.hero-mono {
  position: absolute; left: 34px; bottom: 26px; z-index: 2;
  width: 92px; height: 92px; font-size: 38px;
  color: var(--cdk); background: rgba(0,0,0,0.09); box-shadow: inset 0 0 0 2px rgba(0,0,0,0.2);
}
/* ── The text block stops where the line-up starts ──
 *
 * Bottom-anchored, so the figure holds its position and a name that needs two
 * lines grows UPWARD into the empty colour rather than pushing the money down.
 *
 * **`max-width` is set inline, per card, because it depends on how many
 * photographs that team has** — see `textMax` where the hero is rendered. It
 * was a flat 34% here, which is right for three faces and leaves a team of two
 * with 95px of wasted colour and a name broken over two lines for nothing.
 *
 * The 360px below is only what a card falls back to if that inline value ever
 * goes missing: wide enough not to crop a name, narrow enough not to reach the
 * three-photograph case at x=347. It is a backstop, not the number. */
.hero-text {
  position: absolute; right: 24px; bottom: 20px; z-index: 3; max-width: 360px; text-align: right;
}
/* Two lines, and no more. `AKS Perfumes` becomes `AKS / Perfumes`; a single
   word too long for one line — `WeKravehealthy` is the longest in the feed —
   is ellipsised by the clamp rather than breaking mid-word, which is the one
   thing worse than a shortened name. */
.hero-name {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; white-space: normal; overflow-wrap: normal;
  font-size: 32px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.05;
}
.hero-fig {
  display: block; margin-top: 2px;
  font-size: 46px; font-weight: 900; font-stretch: 78%; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

/* ── The compact cards ──────────────────────────────────── */
.grid {
  position: absolute; left: var(--safe-x); right: var(--safe-x); top: 424px; bottom: var(--safe-y);
  display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr);
  column-gap: 14px; row-gap: 11px; z-index: 2;
}
/* No podium yet: the grid takes the whole board and everyone is equal. */
.grid[data-flat] {
  top: 168px; grid-template-rows: repeat(7, 1fr);
}

.card {
  position: relative; display: flex; align-items: center; gap: 10px;
  min-width: 0; overflow: hidden; padding: 0 12px 0 18px;
  /* ── Continuous corners, and the radius has to grow with them ──
   * A superellipse stands 0.159·√2·r off the box corner where a circular arc
   * stands 0.293·√2·r — 0.54 as deep at the same number — so `corner-shape`
   * at an unchanged radius makes a corner SQUARER, not smoother. Apple's
   * continuous corner needs the radius multiplied by ~1.85 to land where the
   * old one was: 8px → 15px here, 14px → 26px on the heroes. **Move one
   * without the other and the shape changes rather than the smoothing.**
   * Chrome has had the property since 139; the fallback is a genuinely
   * rounder corner, not a missing one. */
  border-radius: 15px; corner-shape: squircle;
  /* ── One soft light, on all thirty-six ──
   *
   * Layered over the card's own gradient rather than drawn as an element:
   * thirty-six extra nodes for a glow is thirty-six nodes the board does not
   * need, and this costs none. It paints in `--sh` — the card's colour moved
   * AWAY from its ink — so it can only ever help the type, never wash it out.
   *
   * Faint on purpose. The heroes carry their shape at 0.24 and have room for
   * it; a card is 292x41 with a disc, a name and a figure already in it, so
   * this is a lift in the colour rather than anything you would call a shape. */
  background:
    radial-gradient(78% 150% at 26% 62%,
      color-mix(in srgb, var(--sh) 26%, transparent) 0%, transparent 62%),
    linear-gradient(104deg, var(--a), var(--b));   /* see .hero */
  color: var(--cdk);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 6px 16px rgba(0,0,0,0.3);
  animation: card-in 560ms cubic-bezier(0.16, 1, 0.3, 1) both;
}
/* 12px and a fade was too small to register at six metres — the board looked
   like it simply appeared. 20px and a hair of scale reads as the card landing
   without becoming a bounce. The distance is the part to keep modest: this is
   a board of thirty-nine, and anything with travel in it becomes a swarm. */
@keyframes card-in {
  from { opacity: 0; transform: translateY(20px) scale(0.985); }
  to   { opacity: 1; transform: none; }
}
.card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 10px;
  background: var(--ce);
  z-index: 3;
}
/* ── Eight shapes, not one swoosh thirty-nine times ──
 *
 * The same ellipse on every card made the board look printed from one
 * template. `shapeFor` hashes different bits of the team id from the colour
 * so two ventures that land on similar tints are still told
 * apart by the shape their card is cut with.
 *
 * All eight enter from the RIGHT: the left of a card belongs to the rank
 * disc and the venture's name, and nothing decorative may cross it.
 *
 * **`sh-9` is the exception and it is the only one.** The eight are ground for
 * a card to sit on; the chevrons are a statement, and a statement about
 * climbing has to start behind the team and travel forward. Entering from the
 * left is the whole point of it — see the note at `sh-9`. */
.shape {
  position: absolute; inset: 0; z-index: 0; overflow: hidden;
  pointer-events: none;
}
.shape i {
  position: absolute; display: block;
  /* ── A shape may never cost a figure its contrast ──
     This was painted in `--ce`, and on a dark card the edge is BRIGHT by
     design — so the shape lightened the card under white ink and dropped the
     worst hero figure to 4.39:1, under the 4.5 bar, before the chevrons
     existed. `--sh` is the card moved AWAY from its own ink, so blending it in
     can only raise contrast. */
  background: linear-gradient(140deg, var(--sh), var(--cd));
}
/* 1 · sweeping ellipse from the top right */
.hero.sh-1 i { right: -16%; top: -74%; width: 66%; height: 246%; border-radius: 50%; transform: rotate(-14deg); }
/* 2 · full circle rising from the bottom right */
.hero.sh-2 i { right: -12%; bottom: -120%; width: 74%; height: 300%; border-radius: 50%; }
/* 3 · a raked band straight across */
.hero.sh-3 i { right: -10%; top: -30%; width: 46%; height: 160%; transform: skewX(-22deg); }
/* 4 · quarter round tucked into the top right corner */
.hero.sh-4 i { right: 0; top: 0; width: 58%; height: 100%; border-radius: 0 0 0 100%; }
/* 5 · wide arc along the bottom */
.hero.sh-5 i { right: -8%; bottom: -170%; width: 80%; height: 240%; border-radius: 50%; }
/* 6 · wedge off the right edge */
.hero.sh-6 i { right: 0; top: 0; width: 62%; height: 100%; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
/* 7 · disc centred on the right edge */
.hero.sh-7 i { right: -22%; top: 50%; width: 62%; height: 210%; border-radius: 50%; transform: translateY(-50%); }
/* 8 · two raked stripes */
.hero.sh-8 i { right: -14%; top: -30%; width: 74%; height: 160%; transform: skewX(-22deg);
  background: repeating-linear-gradient(90deg, var(--sh) 0 22%, transparent 22% 44%); }

/* 9 · two chevrons, and only ever on rank 1 ─────────────
 *
 * The other eight are sweeps and arcs — ground for a card to sit on. This one
 * points, which is why it is not in the hash: a shape with a direction in it
 * has to belong to a POSITION rather than to whichever venture's id happens
 * to draw it.
 *
 * ── Which direction, and it took being wrong once to see it ──
 *
 * It spent a few hours on rank 2 pointing right, on the reasoning that an
 * arrow in the middle points along the podium. It does — **toward rank 3.**
 * The board reads 1-2-3 left to right, so a right-pointing arrow on any card
 * points down the ranking, and on the middle one it aims at the losing end.
 *
 * On rank 1, entering from the LEFT, the same arrow says the opposite: it
 * starts behind the line-up and travels forward past them, which is a leader
 * still climbing. That is the sentence this shape is for, and it is why this
 * one shape breaks the enter-from-the-right rule above.
 *
 * Drawn as two squares wearing only their top and right borders, turned 45deg.
 * A chevron has no fill, so unlike the eight it reads at the card's own edge
 * colour rather than as a gradient body. */
.hero.sh-9 i { inset: 0; background: none; }
.hero.sh-9 i::before, .hero.sh-9 i::after {
  content: ''; position: absolute; top: 50%;
  width: 344px; height: 344px;                 /* 1.25x of 275 */
  border: 100px solid var(--sh); border-left: 0; border-bottom: 0;
  /* Borders top-and-right turned 45deg point the corner RIGHT. It wore a
     `scaleX(-1)` to point left for a while; the mirror is worth remembering
     rather than just deleting, because it moves the INK as well as the
     direction — the 314px that reach right of the element's centre swing to
     the left of it — so `right` below has to be re-derived on every flip. */
  transform: translateY(-50%) rotate(45deg);
}
/* ── Where the bleed is measured ──
 * Turned 45deg, a 355px box paints 251px of ink to the right of its own
 * centre and 502px tall — so on a 232px card the arms leave through the top
 * and bottom by design, and the `right` values below are set from the INK
 * rather than from the box, which sits 73.5px inside it. The leading chevron
 * is placed to hang a quarter of its width past the card's right edge; the
 * card clips it, which is what makes it read as passing through rather than
 * as a decal sitting on top. */
/* ── One chevron, not two ─────────────────────────────
 *
 * It was a pair from the day it was built. A single `<` says the same thing
 * with less: two of them read as a motif, one reads as a mark. `::after` is
 * hidden rather than deleted so the pair is one line away if it is ever
 * wanted back.
 *
 * ── Where it sits, and why the number looks arbitrary ──
 *
 * A 444px box turned 45deg paints `(444/2) x sqrt2` = 314px of ink, and
 * `centre = 592 - right - 222`. Pointing right, that ink spans `centre` to
 * `centre + 314`, so 7.4% puts it at x=326..640: the tip clear of the
 * photographs, which end at 347, and the open end 48px past the card's right
 * edge so it is cut by the card rather than floating inside it.
 *
 * Re-derive this if the direction changes again — pointing left, the same
 * centre would put the ink at 12..326 instead. Fixed here; rank 1 is the only
 * card that draws it. */
.hero.sh-9 i::before { right: 7.4%; }
.hero.sh-9 i::after  { display: none; }

/* ── 10-13 · the quiet set ─────────────────────────────
 *
 * Four alternatives to the sweeps, added 20 September 2026 while choosing
 * what the podium wears. They share a property the eight do not: none of them
 * is a SHAPE so much as a treatment, so none can fight a cutout or a figure
 * for attention. All four paint in `--sh`, the card's own colour moved away
 * from its ink, so none can cost the type its contrast.
 *
 * Preview any of them across all three cards with `?shape=N`. */

/* 10 · concentric rings, radiating from off the right edge */
.hero.sh-10 i {
  inset: 0; border: 0; border-radius: 0; transform: none; clip-path: none;
  background: repeating-radial-gradient(circle at 108% 50%,
    transparent 0 74px, var(--sh) 74px 84px);
}

/* 11 · a halftone field, fading in from the right */
.hero.sh-11 i {
  inset: 0; border: 0; border-radius: 0; transform: none; clip-path: none;
  background: radial-gradient(var(--sh) 3px, transparent 3.5px);
  background-size: 26px 26px;
  mask-image: linear-gradient(100deg, transparent 18%, black 78%);
  -webkit-mask-image: linear-gradient(100deg, transparent 18%, black 78%);
}

/* 12 · hairline diagonals, on the wall's own -11deg rake */
.hero.sh-12 i {
  inset: 0; border: 0; border-radius: 0; transform: none; clip-path: none;
  background: repeating-linear-gradient(104deg, var(--sh) 0 4px, transparent 4px 34px);
  mask-image: linear-gradient(100deg, transparent 12%, black 70%);
  -webkit-mask-image: linear-gradient(100deg, transparent 12%, black 70%);
}

/* 13 · one diagonal, the card in two tones and nothing else */
.hero.sh-13 i {
  inset: 0; border: 0; border-radius: 0; transform: none; background: var(--sh);
  clip-path: polygon(42% 0, 100% 0, 100% 100%, 12% 100%);
}
.hero.sh-10 i::before, .hero.sh-10 i::after,
.hero.sh-11 i::before, .hero.sh-11 i::after,
.hero.sh-12 i::before, .hero.sh-12 i::after,
.hero.sh-13 i::before, .hero.sh-13 i::after { display: none; }

/* ── 14-17 · the second set, when none of the first was right ─────────
 *
 * The quiet set was still geometry. These are not: two are light rather than
 * shape, one is the card's own edge, and one is the venture's own initials.
 * Preview with `?shape=N` as before. */

/* 14 · nothing at all. The card is its gradient and its colour. */
.hero.sh-14 i { display: none; }

/* 15 · one soft light, thrown from behind the line-up */
.hero.sh-15 i {
  inset: 0; border: 0; border-radius: 0; transform: none; clip-path: none;
  background: radial-gradient(60% 120% at 34% 58%, var(--sh) 0%, transparent 62%);
}

/* 16 · a hairline inset from the card's own edge */
.hero.sh-16 i {
  inset: 14px; border: 2px solid var(--sh); border-radius: 12px;
  background: none; transform: none; clip-path: none;
}

/* 17 · the venture's initials, oversized and set behind everything */
.hero.sh-17 i {
  inset: 0; border: 0; background: none; transform: none; clip-path: none;
  display: grid; place-items: center end; padding-right: 38px;
}
.hero.sh-17 i::before {
  content: attr(data-mono);
  font-size: 190px; font-weight: 900; font-stretch: 70%; line-height: 0.8;
  color: var(--sh); letter-spacing: -0.04em;
}
.hero.sh-14 i::before, .hero.sh-14 i::after,
.hero.sh-15 i::before, .hero.sh-15 i::after,
.hero.sh-16 i::before, .hero.sh-16 i::after,
.hero.sh-17 i::after { display: none; }

/* The heroes wear the same eight, bigger. */
.hero .shape { opacity: 0.24; }
.hero.hero.sh-1 i { right: -14%; top: -46%; width: 62%; height: 176%; }
.hero.hero.sh-3 i { width: 40%; }
.hero.hero.sh-4 i { width: 50%; }
.hero.hero.sh-6 i { width: 54%; }
.hero.hero.sh-8 i { width: 78%; background: repeating-linear-gradient(90deg, var(--sh) 0 26%, transparent 26% 60%); }

.card-pos {
  position: relative; z-index: 1; flex: none;
  display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
  background: var(--ce); color: var(--cdi);
  font-size: 20px; font-weight: 900; font-stretch: 76%; line-height: 1;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 2px 6px rgba(0,0,0,0.22);
}
.card-text { position: relative; z-index: 1; min-width: 0; flex: 1; }
.card-name {
  min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  display: block; font-size: 19px; font-weight: 800; letter-spacing: -0.005em;
}
.card-fig {
  display: block; margin-top: 1px;
  font-size: 23px; font-weight: 900; font-stretch: 78%; letter-spacing: -0.015em;
  font-variant-numeric: tabular-nums;
}

/* ── Nothing sold in the window ─────────────────────────
 *
 * The card keeps its livery; only the figure changes. A dash reads as "no
 * number yet" without making a venture look switched off, and the count in
 * the masthead says how many are in that state. */
.quiet .card-fig, .quiet .hero-fig {
  opacity: 0.52; font-weight: 800;
}

.day-chip {
  display: inline-block; margin-bottom: 12px; padding: 8px 18px; border-radius: 6px;
  background: var(--accent); color: #200d38;
  font-size: 22px; font-weight: 900; font-stretch: 84%; letter-spacing: 0.1em; text-transform: uppercase;
}
</style></head>
<body><div class="tv">
  <div class="stripes"></div>
  <header class="wall-head">
    <div class="mast">
      <span><span class="mast-kicker">Forge C1</span>
      <span class="mast-word" id="mast-word"></span></span>
      <span id="chip-slot"></span>
    </div>
    <div class="meta">
      <div><span class="meta-label" id="m-label">Sales today</span><span class="meta-value" id="m-total">&nbsp;</span></div>
    </div>
  </header>
  <div class="heroes" id="heroes"></div>
  <div class="grid" id="grid"></div>
</div>
<script src="/tv/tv.js"></script>
<script>
/* ── One layout, three boards ──────────────────────────────────────────────
 *
 * `/daily`, `/weekly` and the 10-Day Challenge are the same slide reading a
 * different column, so they are one file and a `?board=` rather than three
 * copies that drift. The rewrite in `next.config.ts` is what gives each of
 * them a real URL.
 *
 * All three rank with `rankPeriod`, which falls back to ALL-TIME revenue and
 * never to units — `compareDaily`, `compareWeek` and `compareChallenge` in
 * `lib/ranking.ts` are the same rule, and `lib/tvWall.test.ts` holds this file
 * to all three.
 *
 * **The week is the sheet's week, not one computed here.** `week_revenue` is
 * `TV_Feed`'s own column, anchored at `TV_Feed!D2` — 31 August 2026, which is
 * a Monday — so it zeroes at Monday 00:00 IST and runs Monday to Sunday. A
 * second opinion about where a week starts is how a board comes to disagree
 * with the sheet it is printing, so nothing here asks the clock. */
const BOARDS = {
  day:       { key: 'today',     word: '<em>Daily</em> Leaderboard',  label: 'Today’s sales',     title: 'BYOB — Daily Leaderboard' },
  week:      { key: 'week',      word: '<em>Weekly</em> Leaderboard', label: 'This week’s sales', title: 'BYOB — Weekly Leaderboard' },
  challenge: { key: 'challenge', word: '<em>10-Day</em> Challenge',   label: 'Challenge sales',   title: 'BYOB — 10-Day Challenge' },
}
const Q = new URLSearchParams(location.search)
const DEMO = Q.get('demo')
/* ── The PATH decides which board, not a query ──
 *
 * `/weekly` is a rewrite onto this file, and a rewrite does not change the
 * client URL: the destination's `?board=week` exists only on the server, so
 * `location.search` here is empty and a query-driven switch silently falls
 * back to the day board. `/weekly` served a flawless DAILY leaderboard —
 * right figures, right ranking, wrong week, nothing to report it. Measured,
 * not reasoned about.
 *
 * `?board=` survives for opening the file directly at `/tv/floor.html`, and
 * `?mode=challenge` for the rotator, which sets it on the iframe's own URL
 * where the browser can see it. */
const PATH_BOARD = { '/weekly': 'week', '/daily': 'day' }
const WHICH = Q.get('mode') === 'challenge'
  ? 'challenge'
  : (PATH_BOARD[location.pathname] ?? Q.get('board') ?? 'day')
const BOARD = BOARDS[WHICH] ?? BOARDS.day
const challenge = WHICH === 'challenge'
const KEY = BOARD.key
document.title = BOARD.title

/* Named so a fresh poll can repaint it; see `onFreshData` in tv.js. */
const paint = (teams) => {
  
  
  

  if (DEMO === 'quiet') teams.forEach((t, i) => { if (i > 2) t[KEY] = 0 })
  if (DEMO === 'empty') teams.forEach((t) => { t[KEY] = 0 })
  if (DEMO === 'busy') teams.forEach((t) => { t[KEY] = Math.round(400 + Math.random() * 30000) })
  const ranked = rankBy(teams, KEY)
  const total = ranked.reduce((s, t) => s + t[KEY], 0)

  document.getElementById('mast-word').innerHTML = BOARD.word
  if (challenge) document.getElementById('chip-slot').innerHTML = '<span class="day-chip">Day 7 of 10</span>'

  // One figure, named in the language the rest of the wall uses. "Taken" was
  // warehouse English; "Sales today" says what it is, and quietly carries the
  // timeframe the window line used to.
  document.getElementById('m-label').textContent = BOARD.label
  document.getElementById('m-total').textContent = rupees(total)

  // A podium needs three ventures that have actually sold something.
  const sellers = ranked.filter((t) => t[KEY] > 0).length
  const podium = sellers >= 3
  document.getElementById('heroes').hidden = !podium
  document.getElementById('grid').toggleAttribute('data-flat', !podium)

  // The three the day belongs to.
  /* ── Two of the three places own their shape; only third place varies ──
   *
   * Rank 1 is the chevrons and rank 2 is the raked stripes, whoever is
   * standing there — a shape that belongs to a POSITION rather than to a
   * team, the way the numeral does.
   *
   * Rank 3 still belongs to its venture: `shapeFor` hashes the team id, and
   * the answer is folded into the round forms only — the ellipse, the circle,
   * the quarter round, the arc and the disc. So the last card is always a
   * curve after a striped one and a pointed one, and it still changes when
   * the team does.
   *
   * No de-duplication needed: a circle cannot collide with 8 or 9. */
  const ROUND = [1, 2, 4, 5, 7]
  /* `?shape=N` puts one shape on all three cards, for choosing between them
     side by side. No param is the real board. */
  const FORCED = Number(Q.get('shape')) || 0
  const heroShape = (t, i) =>
    FORCED ? FORCED
    : i === 0 ? 9 : i === 1 ? 8 : ROUND[shapeFor(t.id) % ROUND.length]
  const heroShapes = (podium ? ranked.slice(0, 3) : []).map(heroShape)
  document.getElementById('heroes').innerHTML = (podium ? ranked.slice(0, 3) : []).map((t, i) => {
    const quiet = t[KEY] <= 0
    // Faces when the manifest has them, the monogram when it does not — the
    // same fallback the Ladder and /live use, so ZAAREE topping the day is a
    // card rather than a hole.
    const squad = squadHtml(t.id, 188, 4)
    /* ── The text takes whatever the line-up leaves ──
     *
     * This was a flat `max-width: 34%`, which is the right number for THREE
     * photographs and wrong for every other count: a team of two left 95px of
     * empty colour beside its name and broke `Notty Crunch` over two lines for
     * no reason. Reported as exactly that.
     *
     * The squad's width is arithmetic rather than a measurement — a crop is
     * `188 x 96/132` = 137px wide and they overlap by 31%, so `n` of them are
     * `95n + 42` — and the card is 592 with the squad starting at 20, 24px of
     * right padding and 20px of air between the two:
     *
     *     592 - 24 - (20 + 95n + 42) - 20  =  486 - 95n
     *
     *     1 photo  391px     3 photos  201px
     *     2 photos 296px     4 photos  106px
     *
     * No photographs at all is the monogram, which ends at x=126, so the text
     * gets 422. **The 20px of air is the part to keep**: it is what stopped a
     * long name running into the third person, and it survives every count. */
    const faces = Math.min(squadOf(t.id).length, 4)
    const textMax = faces ? 486 - 95 * faces : 422
    return `<div class="hero sh-${heroShapes[i]} liv-${liveryFor(t.id)}${quiet ? ' quiet' : ''}"
                 style="animation-delay:${60 + i * 90}ms">
      <span class="shape"><i data-mono="${monogram(t.name, t.id)}"></i></span>
      <span class="hero-edge"></span>
      <span class="hero-num">${i + 1}</span>
      ${squad ? `<span class="hero-squad">${squad}</span>`
              : `<span class="mono hero-mono">${monogram(t.name, t.id)}</span>`}
      <span class="hero-text" style="max-width:${textMax}px">
        <span class="hero-name">${t.name}</span>
        <span class="hero-fig">${rupees(t[KEY])}</span>
      </span>
    </div>`
  }).join('')

  /* ── The stagger is a diagonal, not a reading order ──
   *
   * `i * 12ms` walks the grid left-to-right and top-to-bottom, which on a 6x6
   * is a typewriter: 36 cards arriving in sequence looks like a list being
   * printed, and the last one is 420ms behind the first for no reason the eye
   * can see.
   *
   * By `row + column` instead, every card on the same diagonal arrives
   * together — a single wave crossing the board from the top-left corner. Ten
   * steps rather than thirty-six, so it is over sooner AND more legible, which
   * is the rare case where both improve at once. */
  const cardDelay = (i) => {
    const COLS = 6
    const diagonal = Math.floor(i / COLS) + (i % COLS)
    return (podium ? 240 : 40) + diagonal * 46
  }

  // The field: 36, six by six, reading left to right.
  document.getElementById('grid').innerHTML = ranked.slice(podium ? 3 : 0).map((t, i) => {
    const rank = i + (podium ? 4 : 1), quiet = t[KEY] <= 0
    return `<div class="card liv-${liveryFor(t.id)}${quiet ? ' quiet' : ''}"
                 style="animation-delay:${cardDelay(i)}ms">
      <span class="card-pos">${rank}</span>
      <span class="card-text">
        <span class="card-name">${t.name}</span>
        <span class="card-fig">${rupees(t[KEY])}</span>
      </span>
    </div>`
  }).join('')
}
Promise.all([loadTeams(), loadPhotos()]).then(([teams]) => { paint(teams); onFreshData(paint) })
</script></body></html>
