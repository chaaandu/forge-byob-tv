<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>BYOB — the wall</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0512}
  /* The stage stays 1920x1080 and scales as one; see .tv in tv.css. */
  #stage{position:absolute;top:50%;left:50%;width:1920px;height:1080px;
         transform:translate(-50%,-50%) scale(var(--fit,1))}
  iframe{position:absolute;inset:0;width:1920px;height:1080px;border:0;opacity:0;transition:opacity 340ms}
  iframe.on{opacity:1}
</style></head><body>
<!-- Thirty seconds a slide, the way Rotator does it.

     ── The next slide is built six seconds early ──

     A cold browser needs about a second to fetch the sheet, and even warm the
     swap costs 15-40ms. Neither is much, but neither has to be paid at all:
     the incoming slide is given its src at T+24s, renders while hidden, and at
     T+30s the only work left is a cross-fade.

     The catch, and the reason this is not just `src` set earlier: a page that
     renders while invisible plays its ENTRANCE while invisible. So each slide
     holds its animations at frame 0 (see the `holding` class in tv.css) and
     this posts `byob:show` at the moment of the swap. The board is already
     painted; the arrival still happens in front of somebody. -->
<div id="stage"><iframe id="a"></iframe><iframe id="b"></iframe></div>
<script>
  /* ── Three slides, thirty seconds each: the ladder, the week, the day ──
   *
   * `/daily` came out of the rotation on 21 September 2026 and went back in on
   * 23 September as THE DAILY (`daily.html`) — the day's top ten as a magazine
   * cover. Asked for directly.
   *
   * **The 10-Day Challenge is still not on the wall.** It lives on the old
   * slide, and `daily.html` forwards `/daily?mode=challenge` to it. Flipping
   * `challenge_mode` in `TV_Cohort` changes nothing here on its own: to run a
   * challenge, this entry becomes `/daily?mode=challenge` for the duration. */
  const SLIDES = ['/podium', '/weekly', '/daily']
  /* LEAD is how early the next slide is built. 6s was enough on a fast
     network — measured on the deployed wall, a prefetched slide rendered in
     62-95ms and was revealed already full — but it is the whole margin the
     wall has against a slow CSV fetch at the venue, so it is 15s now.
     **The slides' own safety timeout has to stay longer than this.** They hold
     their entrance until `byob:show` arrives and release themselves if it
     never does; a safety shorter than LEAD fires while the frame is still
     invisible and the slide appears with its arrival already over. */
  const PERIOD = 30000, LEAD = 15000

  /* ── The day board sits out until somebody has sold ──
   *
   * Before the first sale of the day `/daily` is an open cover and nine open
   * places, and thirty seconds of that on a TV is thirty seconds of an empty
   * page. Asked for directly: skip it. The loop is `/podium` and `/weekly`
   * until the first sale lands, and the day board joins on the next cycle —
   * nobody has to touch the laptop, in either direction, and after midnight
   * IST (when `today_revenue` zeroes) it steps out again on its own.
   *
   * Decided from the feed the slides already keep in localStorage (`CACHE_KEY`
   * in tv.js), not from a fetch of its own: every slide refreshes that cache on
   * mount and every thirty seconds, so it is never more than a slide old.
   *
   * **Only a positive "nobody has sold" hides it.** No cache, a cache that will
   * not parse, or anything else unknown shows the slide — a board that is
   * wrongly present says "open"; a board that is wrongly absent says nothing,
   * and nothing on this wall would report it. Only the bare `/daily` is
   * checked: `/daily?mode=challenge` ranks a different column, and a quiet
   * morning is not a reason to hide a challenge. */
  const CACHE_KEY = 'byob-tv.feed'
  /* ── …and until the top ten is full ──
   *
   * Asked for directly on 24 September 2026: the day board joins the loop
   * only once MIN_SELLERS teams have sold today, so the TV only ever shows a
   * complete top ten. The cost, stated when it was chosen: on the data this
   * wall has seen, ten sellers in a day arrives mid-afternoon at the
   * earliest (a working Friday had 6 of 41 at 2pm), so on a quiet day the
   * slide does not appear at all, and the first sale of the day — the cover
   * changing hands at 11am — is never on the TV. Lower this number and the
   * slide comes back earlier, with `daily.html`'s open panel standing in for
   * the places not yet taken. Opening `/daily` directly always shows it. */
  const MIN_SELLERS = 10
  function hasContent(path) {
    if (path !== '/daily') return true
    try {
      const teams = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null')?.teams
      if (!Array.isArray(teams) || teams.length === 0) return true
      // The spares never trade and are never on the board, so they never count.
      const SPARES = ['VBC140', 'VBC141', 'VBC138', 'VBC104']
      return teams.filter((t) => !SPARES.includes(t.id) && Number(t.today) > 0).length >= MIN_SELLERS
    } catch { return true }
  }
  /** The next slide after `k` that has something to show. `/podium` always
      does, so this never runs out; the fallback is only a guard. */
  function nextAfter(k) {
    for (let step = 1; step <= SLIDES.length; step += 1) {
      const j = (k + step) % SLIDES.length
      if (hasContent(SLIDES[j])) return j
    }
    return (k + 1) % SLIDES.length
  }
  const f = [document.getElementById('a'), document.getElementById('b')]
  let i = 0, front = 0

  const show = (frame) => {
    frame.classList.add('on')
    try { frame.contentWindow.postMessage('byob:show', '*') } catch { /* not ready */ }
  }

  f[0].src = SLIDES[0]
  f[0].addEventListener('load', () => show(f[0]), { once: true })

  /* Prefetch at PERIOD-LEAD, swap at PERIOD. A plain `setInterval` firing at
     PERIOD and swapping LEAD later would have made every slide 36 seconds
     long and moved the prefetch to the moment of the swap, which is the thing
     this exists to avoid. Measured before it was noticed. */
  function cycle() {
    const back = 1 - front
    const next = nextAfter(i)
    f[back].src = SLIDES[next]
    setTimeout(() => {
      i = next
      show(f[back])
      f[front].classList.remove('on')
      front = back
      setTimeout(cycle, PERIOD - LEAD)
    }, LEAD)
  }
  setTimeout(cycle, PERIOD - LEAD)
</script><script>
  const fit=()=>document.documentElement.style.setProperty('--fit',
    String(Math.min(innerWidth/1920, innerHeight/1080)))
  fit(); addEventListener('resize', fit)
</script></body></html>
