<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>BYOB — Today's Top Seller</title>
<link rel="stylesheet" href="/tv/tv.css">
<script>
  /* Held until the rotator says the frame is on screen; see floor.html. The
     25s safety must stay above LEAD in wall.html (15s). */
  if (window.top !== window) {
    document.documentElement.classList.add('holding')
    const show = () => document.documentElement.classList.remove('holding')
    addEventListener('message', (e) => { if (e.data === 'byob:show') show() })
    setTimeout(show, 25000)
  }
  /* The 10-Day Challenge still lives on the old slide. `/daily?mode=challenge`
     is how wall.html has always asked for it, so it keeps working. */
  if (new URLSearchParams(location.search).get('mode') === 'challenge') {
    location.replace('/tv/floor.html?mode=challenge')
  }
</script>
<style>
/* ============================================================
   TODAY'S TOP SELLER — the day's top ten. (Served at `/daily`.)

   ── Redone on 24 September 2026, the third design ──
   The magazine cover (white paper, a diagonal seam, a gold starburst) was the
   one slide on the wall that did not look like the wall: two surfaces and
   four visual languages. Asked for: the same background as `/weekly`, and
   everything else its own.

   So it is ONE dark surface — Weekly's exactly — and one idea: speed. The
   masthead is raked and trails speed lines; the No. 1 stands in a spotlight
   of its own livery, rising from behind a finish line in the same colour;
   Nos. 2-10 streak in from the right as clean lines, each marked by a raked
   slash in its team's colour. No cards, no boxes, no paper.

   ── Only the ten ──
   A board of thirty-seven on ₹0 at 11am says "nobody is selling". The wall
   only shows this slide once ten have sold (`MIN_SELLERS` in wall.html);
   opened directly before that, the open panel stands in for the places left.

   ── Motion ──
   Every movement is an ARRIVAL: once, `both`, no iteration count, over in
   about four seconds. Then the slide is still. Nothing moves at rest.

   ── Colour ──
   No colour is named in this file: page tokens, the leader's livery (`--a`,
   `--ce`) from `.liv-N`, and the gold tokens, all in tv.css.
   ============================================================ */

:root {
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-quart: cubic-bezier(0.25, 1, 0.5, 1);
  --col: 1000px;           /* the No. 1's column, from the left edge */
  --list-left: 1110px;     /* where the list starts */
}

/* Weekly's own background, so the three slides are one wall. */
.tv {
  background:
    radial-gradient(120% 70% at 88% -10%, var(--glow) 0%, transparent 62%),
    radial-gradient(90% 60% at 4% 104%, color-mix(in srgb, var(--glow) 60%, var(--page)) 0%, transparent 60%),
    var(--page);
}

@keyframes rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
@keyframes wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* ── The masthead: TOP ≡≡≡ / TODAY'S SELLER ── (`.tsm`: tv.css already owns `.mast`)
   The Back to the Future lockup, chosen from four studies: raked like every
   numeral on the wall, TOP trailing speed lines, the small word tucked in
   front of SELLER. White on the dark, the lines and the small word in the
   accent. TOP drives in from the left, then the lines draw out behind it. */
.tsm {
  position: absolute; left: 58px; top: 44px; z-index: 5; color: var(--ink);
  transform: skewX(-11deg); transform-origin: 0 100%;
}
.tsm .l1, .tsm .l2 { display: flex; align-items: flex-end; white-space: nowrap; }
.tsm .l2 { margin-top: 14px; }
.tsm .big { font-size: 170px; font-weight: 900; font-stretch: 74%; letter-spacing: -0.02em; line-height: 0.74;
  animation: drive 800ms var(--ease-out) 150ms both; }
.tsm .l2 .big { animation-delay: 300ms; }
@keyframes drive { from { opacity: 0; transform: translateX(-90px); } to { opacity: 1; transform: none; } }
.tsm .speed {
  align-self: center; margin-left: 24px; width: 470px; height: 92px;
  background: repeating-linear-gradient(to bottom, var(--accent) 0 9px, transparent 9px 21px);
  mask-image: linear-gradient(to right, black 20%, transparent);
  transform-origin: 0 50%; animation: wipe 900ms var(--ease-out) 550ms both;
}
.tsm .small { display: flex; flex-direction: column; margin: 0 16px 4px 0;
  font-size: 48px; font-weight: 900; font-stretch: 80%; line-height: 0.86; color: var(--accent);
  animation: rise 700ms var(--ease-out) 450ms both; }

/* ── The No. 1 ────────────────────────────────────────────
   A spotlight in the team's own colour, the team rising from behind a finish
   line in that colour, and under the line the name in white and the figure
   in gold. Nothing is drawn below the line while the team rises — the
   line-up is clipped there (`clip-path` in starsHtml), so no frame of the
   arrival shows the bottoms of the photographs. */
.spot {
  position: absolute; left: calc(var(--col) / 2 - 560px); top: 250px; width: 1120px; height: 760px;
  z-index: 1; pointer-events: none; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--a) 38%, transparent), transparent);
  animation: spot 1400ms var(--ease-out) 1000ms both;
}
@keyframes spot { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: none; } }
.stars { position: absolute; z-index: 3; display: flex; align-items: flex-end; }
.star { position: relative; display: block; flex: none; animation: star-in 1200ms var(--ease-out) both; }
/* 450-wide crop in a box sized for the old 370 (see WIDTH in scripts/cutout.py). */
.star img { display: block; position: absolute; left: 50%; bottom: 0; width: 121.62%; max-width: none; height: auto;
  transform: translateX(-50%); filter: drop-shadow(0 12px 24px var(--shade)); }
@keyframes star-in {
  from { opacity: 0; transform: translateY(160px); filter: blur(10px); }
  40%  { opacity: 1; }
  to   { opacity: 1; transform: none; filter: blur(0); }
}
.star-mono {
  position: absolute; left: calc(var(--col) / 2 - 210px); top: 350px; z-index: 3;
  width: 420px; height: 420px; border-radius: 50%; display: grid; place-items: center;
  background: var(--ce); color: var(--cdi);
  font-size: 200px; font-weight: 900; font-stretch: 80%; letter-spacing: -0.04em;
  animation: star-in 1200ms var(--ease-out) 1500ms both;
}
/* The finish line: the leader's colour, full width of the column, raked ends. */
.finish {
  position: absolute; left: 0; width: var(--col); top: 772px; height: 12px; z-index: 4;
  background: var(--a); clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
  transform-origin: 0 50%; animation: wipe 700ms var(--ease-out) 900ms both;
}
.lead-name {
  position: absolute; left: 58px; top: 810px; width: calc(var(--col) - 100px); z-index: 4;
}
.coverline-name {
  display: block; width: fit-content; max-width: 100%; color: var(--ink);
  font-size: 96px; font-weight: 900; font-stretch: 78%; letter-spacing: -0.02em; line-height: 0.95;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  animation: rise 800ms var(--ease-out) 2200ms both;
}
.coverline-name.two { white-space: normal; text-overflow: clip; text-wrap: balance; line-height: 0.92; }
/* ── The figure, in gold ──
   Gold was a 3D starburst sticker for a day, the one skeuomorphic object on
   the wall. It is the type now: the figure itself, in the crown's metal. The
   third gold thing on the wall is still this one number, argued in AGENTS.md. */
/* The figure and the nazar that rolls in to guard it (`nazar.js`). */
.lead-fig-row {
  position: absolute; left: 58px; bottom: 34px; z-index: 4;
  display: flex; align-items: center; gap: 24px;
}
.lead-fig {
  font-size: 120px; font-weight: 900; font-stretch: 74%; letter-spacing: -0.02em; line-height: 1;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 55%, var(--gold-mid) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: rise 800ms var(--ease-out) 2450ms both;
}

/* Nobody has sold yet (only ever seen opened directly; the wall skips it). */
.open-line { position: absolute; left: 58px; top: 520px; z-index: 4; max-width: 900px;
  animation: rise 900ms var(--ease-out) 900ms both; }
.open-line b { display: block; font-size: 110px; font-weight: 900; font-stretch: 78%; line-height: 0.92; color: var(--ink); }
.open-line span { display: block; margin-top: 22px; font-size: 32px; font-weight: 700; color: var(--ink-muted); }

/* ── The list: Nos. 2-10, as lines ───────────────────────── */
.list-head {
  position: absolute; left: var(--list-left); right: var(--safe-x); top: 52px; z-index: 4;
  display: flex; justify-content: space-between; align-items: baseline;
  padding-bottom: 20px; border-bottom: 2px solid var(--hairline);
  animation: fade-in 700ms ease-out 100ms both;
}
.list-title { font-size: 44px; font-weight: 900; font-stretch: 76%; line-height: 1; color: var(--ink); }
.list-sum { display: flex; align-items: baseline; gap: 16px; }
.list-k { font-size: 18px; font-weight: 800; letter-spacing: 0.26em; text-transform: uppercase; color: var(--ink-faint); }
.list-total { font-size: 44px; font-weight: 900; font-stretch: 76%; line-height: 1; color: var(--ink-muted);
  font-variant-numeric: tabular-nums; }

.row {
  position: absolute; left: var(--list-left); right: var(--safe-x); z-index: 4;
  display: flex; align-items: center; gap: 22px;
  border-bottom: 1px solid var(--hairline);
  animation: streak 750ms var(--ease-out) both;
}
/* A row streaks in: fast, from the right, sharpening as it lands. */
@keyframes streak {
  from { opacity: 0; transform: translateX(260px) skewX(-18deg); filter: blur(8px); }
  to   { opacity: 1; transform: none; filter: blur(0); }
}
.row-rank {
  flex: none; width: 70px; text-align: right;
  font-size: 62px; font-weight: 900; font-stretch: 66%; line-height: 1; letter-spacing: -0.03em;
  color: var(--ink-muted); font-variant-numeric: tabular-nums; transform: skewX(-11deg);
}
/* The team's colour, as one raked slash — identity, not rank. */
.row-mark { flex: none; width: 14px; height: 52px; background: var(--a); transform: skewX(-11deg); }
.row-name {
  flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  font-size: 34px; font-weight: 800; letter-spacing: -0.005em; color: var(--ink);
}
.row-fig {
  flex: none; font-size: 42px; font-weight: 900; font-stretch: 78%; letter-spacing: -0.015em;
  color: var(--ink); font-variant-numeric: tabular-nums;
}

/* ── Fewer than ten: one panel for the places left, not empty rows ── */
.open-panel {
  position: absolute; left: var(--list-left); right: var(--safe-x); bottom: var(--safe-y); z-index: 4;
  display: flex; flex-direction: column; justify-content: center; gap: 22px;
  animation: rise 800ms var(--ease-out) 1600ms both;
}
.open-count { display: flex; align-items: baseline; gap: 22px; }
.open-count b { font-size: 170px; font-weight: 900; font-stretch: 66%; line-height: 0.8; color: var(--accent); }
.open-count span { font-size: 40px; font-weight: 800; line-height: 1.05; color: var(--ink); }
.open-note { font-size: 28px; font-weight: 700; color: var(--ink-muted); }
.slots { display: flex; gap: 14px; }
.slot { width: 34px; height: 34px; border-radius: 50%; flex: none;
  border: 3px dashed color-mix(in srgb, var(--ink-faint) 70%, transparent); }
.slot.taken { border: 0; background: var(--a); }
.open-panel.compact { gap: 14px; justify-content: flex-start; }
.open-panel.compact .open-count b { font-size: 64px; }
.open-panel.compact .open-count span { font-size: 28px; }
.open-panel.compact .open-note { font-size: 22px; }
.open-panel.compact .slot { width: 26px; height: 26px; }

/* `?loop` and the R key replay the arrival; for the laptop's owner only. */
.tv { cursor: default; }
</style></head>
<body><div class="tv" id="tv"></div>
<script src="/tv/tv.js"></script>
<script src="/tv/nazar.js"></script>
<script>
const Q = new URLSearchParams(location.search)
const DEMO = Q.get('demo')
const KEY = 'today'
const html = document.documentElement

const ROW_TOP = 150, ROW_H = 96          // nine rows, y 150-1014
const ROWS_T0 = 700, ROWS_DUR = 2000
const COL = 1000                         // must match --col
const EYE_LINE = 470                     // every team's eyes, whatever its size
const FINISH = 772                       // must match .finish

const MAST = `<div class="tsm">
  <div class="l1"><b class="big">TOP</b><span class="speed"></span></div>
  <div class="l2"><span class="small"><b>TODAY’S</b></span><b class="big">SELLER</b></div></div>`

/* ── The team: centred in the column, eyes on one line, rising from behind
   the finish line ──
   Each crop is 450x440 with eyes at y=120 (scripts/cutout.py), drawn in a
   370-wide box at 121.62%. Heights stay within 1.36x of native so no face
   goes soft; the step between people keeps every face clear of the next. */
function starsHtml(teamId) {
  // `&faces=N` previews a smaller line-up: no current team has exactly one.
  const people = squadOf(teamId, Math.min(4, Number(Q.get('faces')) || 4))
  if (!people.length) return ''
  const n = people.length
  const H = [0, 600, 560, 500, 440][n]
  const W = Math.round(H * 370 / 440)
  const STEP = Math.round(W * [0, 0, 0.55, 0.5, 0.47][n])
  const left = Math.round(COL / 2 - W / 2 - STEP * (n - 1) / 2)
  const top = Math.round(EYE_LINE - 120 * H / 440)
  // Nothing below the finish line is ever drawn, at rest or mid-arrival.
  const clip = `clip-path:inset(-200px -300px ${top + H - FINISH}px -300px)`
  return `<div class="stars" style="left:${left}px;top:${top}px;${clip}">` + people.map((p, i) => {
    const d = Math.abs(i - (n - 1) / 2)   // arrival runs middle-out
    return `<span class="star" style="width:${W}px;height:${H}px;margin-left:${i ? -(W - STEP) : 0}px;` +
      `z-index:${p.z};animation-delay:${1400 + Math.round(d * 160)}ms">` +
      `<img class="${cutClass(p)}" style="${cutStyle(p)}" src="${p.src}" alt=""></span>`
  }).join('') + '</div>'
}

/* ── Counting up ──
   Figures count from zero as they arrive, eased into the true number, and the
   last frame writes the real figure. */
const counters = []
function countUp(el, to, delay, dur) {
  counters.push({ el, to, delay, dur })
  el.firstChild.textContent = rupees(0)
}
function runCounters() {
  const write = (c, v) => { c.el.firstChild.textContent = rupees(v) }
  if (html.classList.contains('settled')) { counters.forEach((c) => write(c, c.to)); return }
  const t0 = performance.now()
  const step = (now) => {
    let live = false
    for (const c of counters) {
      const p = Math.min(1, Math.max(0, (now - t0 - c.delay) / c.dur))
      write(c, p >= 1 ? c.to : Math.floor(c.to * (1 - Math.pow(1 - p, 4))))
      if (p < 1) live = true
    }
    if (live) requestAnimationFrame(step)
  }
  requestAnimationFrame(step)
}
/* The rotator builds this slide hidden and holds its CSS; the counters wait
   for the same signal or they finish before anybody sees them. */
function whenShown(cb) {
  if (!html.classList.contains('holding')) return cb()
  const mo = new MutationObserver(() => {
    if (!html.classList.contains('holding')) { mo.disconnect(); cb() }
  })
  mo.observe(html, { attributes: true, attributeFilter: ['class'] })
}

function paint(teams) {
  counters.length = 0
  if (DEMO === 'empty') teams.forEach((t) => { t[KEY] = 0 })
  if (DEMO === 'busy') teams.forEach((t) => { t[KEY] = Math.round(400 + Math.random() * 30000) })
  // `?sellers=N`: a day on which only N teams have sold, for the open panel.
  if (Q.has('sellers')) {
    const n = Number(Q.get('sellers'))
    ;[...teams].sort((a, b) => b.total - a.total).forEach((t, i) => { t[KEY] = i < n ? 5000 - i * 400 : 0 })
  }
  // `?lead=VBC118` puts that team first; `&amount=` sets its figure and
  // `&name=` its name, for checking a lakh or a long name.
  const LEAD = Q.get('lead')
  if (LEAD) {
    const top = Math.max(...teams.map((t) => t[KEY]))
    const amt = Number(Q.get('amount')) || top + 1000
    teams.forEach((t) => { if (t.id === LEAD) { t[KEY] = amt; if (Q.get('name')) t.name = Q.get('name') } })
  }
  if (Q.has('nofaces')) PHOTOS = []

  // Only teams that have actually sold today. A ₹0 is not a place in the ten.
  const top = rankBy(teams, KEY).filter((t) => t[KEY] > 0).slice(0, 10)
  const all = teams.reduce((s, t) => s + t[KEY], 0)
  const lead = top[0]

  let h = MAST

  if (lead) {
    const liv = `liv-${liveryFor(lead.id)}`
    h += `<div class="spot ${liv}"></div>
      ${starsHtml(lead.id) || `<div class="mono star-mono ${liv}">${monogram(lead.name, lead.id)}</div>`}
      <div class="finish ${liv}"></div>
      <div class="lead-name"><span class="coverline-name">${lead.name}</span></div>
      <div class="lead-fig-row">${nazarHtml('roll')}<div class="lead-fig" id="lead-fig"><span></span></div></div>`
  } else {
    h += `<div class="open-line"><b>Nobody yet.</b><span>The first sale of the day takes this spot.</span></div>`
  }

  h += `<header class="list-head">
    <span class="list-title">Top 10</span>
    <span class="list-sum"><span class="list-k">Today’s total sales</span><span class="list-total" id="all-fig"><span></span></span></span>
  </header>`

  // A row for every team that has sold today; the rest is the open panel.
  for (let r = 2; r <= top.length; r += 1) {
    const t = top[r - 1]
    const y = ROW_TOP + (r - 2) * ROW_H
    // Countdown: the last row lands first and No. 2 last.
    const delay = 200 + (top.length - r) * 110
    h += `<div class="row liv-${liveryFor(t.id)}" style="top:${y}px;height:${ROW_H}px;animation-delay:${delay}ms">
      <span class="row-rank">${r}</span>
      <span class="row-mark"></span>
      <span class="row-name">${t.name}</span>
      <span class="row-fig" data-to="${t[KEY]}"><span></span></span>
    </div>`
  }

  if (lead && top.length < 10) {
    const open = 10 - top.length
    const y = ROW_TOP + Math.max(0, top.length - 1) * ROW_H + 30
    const compact = 1080 - 40 - y < 330
    const slots = Array.from({ length: 10 }, (_, i) => top[i]
      ? `<span class="slot taken liv-${liveryFor(top[i].id)}"></span>`
      : `<span class="slot"></span>`).join('')
    h += `<div class="open-panel${compact ? ' compact' : ''}" style="top:${y}px">
      <span class="open-count"><b>${open}</b><span>${open === 1 ? 'place' : 'places'} still open</span></span>
      <span class="open-note">Any sale today puts your team on this list.</span>
      <span class="slots">${slots}</span>
    </div>`
  }

  document.getElementById('tv').innerHTML = h

  /* One clock for all nine rows, so they are in proportion at every frame and
     the order on screen is true throughout the count. */
  document.querySelectorAll('.row-fig').forEach((el) => countUp(el, Number(el.dataset.to), ROWS_T0, ROWS_DUR))
  if (lead) countUp(document.getElementById('lead-fig'), lead[KEY], 2500, 1500)
  if (lead) nazarWatch(lead[KEY])
  countUp(document.getElementById('all-fig'), all, 150, 2600)
  whenShown(runCounters)
  document.fonts.ready.then(fitName)
}

/* ── A long name shrinks, then wraps, and is never cut ──
   One line from 96px down to 68; below that it goes to two balanced lines,
   from 80px down to 50. Measured unrounded against the column, with 3px to
   spare: rounded integers once let `Fake society studio` print as
   `Fake society stu…`. */
function fitName() {
  const el = document.querySelector('.coverline-name')
  if (!el) return
  const fit = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fit')) || 1
  const avail = el.parentElement.clientWidth - 3
  const set = (px) => { el.style.fontSize = px + 'px' }
  const natural = () => {
    el.style.width = 'max-content'
    const w = el.getBoundingClientRect().width / fit
    el.style.width = ''
    return w
  }
  el.classList.remove('two')
  let size = 96
  set(size)
  while (natural() > avail && size > 68) set(size -= 2)
  if (natural() <= avail) return
  const words = el.textContent.split(/\s+/)
  const widest = () => Math.max(...words.map((w) => {
    const probe = document.createElement('span')
    probe.textContent = w
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font:inherit;font-size:inherit'
    el.appendChild(probe)
    const pw = probe.getBoundingClientRect().width / fit
    probe.remove()
    return pw
  }))
  el.classList.add('two')
  set(size = 80)
  const twoLines = () => widest() <= avail && el.scrollHeight <= size * 0.92 * 2 + 6
  while (!twoLines() && size > 50) set(size -= 2)
}

let TEAMS = null
Promise.all([loadTeams(), loadPhotos()]).then(([teams]) => {
  TEAMS = teams
  paint(structuredClone(teams))
  onFreshData((t) => { TEAMS = t; paint(structuredClone(t)) })
  warmPhotos()
})

/* Replay the arrival: R, a click, or `?loop` to rerun it every thirty seconds
   the way the rotation would. Clears `settled` so the CSS runs again. */
function replay() {
  if (!TEAMS) return
  html.classList.remove('settled')
  document.getElementById('tv').innerHTML = ''
  void document.body.offsetHeight
  paint(structuredClone(TEAMS))
}
addEventListener('keydown', (e) => { if (e.key === 'r' || e.key === 'R') replay() })
addEventListener('click', replay)
if (Q.has('loop')) setInterval(replay, 30_000)
</script></body></html>
